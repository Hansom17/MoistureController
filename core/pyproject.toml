[project]
name = "mc-core"
version = "0.1.0"
description = "Shared code of the MoistureController backend and hub: contract models, pin rules, command checks, rules engine"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "python-ulid>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
