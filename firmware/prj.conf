# Moisture controller, DOIT ESP32 DevKit V1.

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_JSON_LIBRARY=y
CONFIG_CRC=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# Deep sleep between wake cycles; state that must survive lives in RTC slow RAM.
CONFIG_POWEROFF=y
CONFIG_RETAINED_MEM=y

# Settings in the `storage` partition: config, provisioning.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# WiFi station, DHCP, sockets, SNTP.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# MQTT 3.1.1 over TLS 1.2 with a pre-shared key (contracts/mqtt.md §2).
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
# Only this suite: no public-key operations in the handshake, small code (mqtt.md §2).
CONFIG_MBEDTLS_CIPHERSUITE_TLS_PSK_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_PSK_MAX_LEN=32

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# BLE pairing (contracts/ble.md): peripheral with one GATT service; our own secure session
# on top, so no link-layer pairing.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=n
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BASE64=y
# The session's primitives (src/core/mc_ble.c): X25519, HKDF, HMAC, AES-GCM via PSA Crypto.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y

# RAM: the ESP32 has 192 KB of static data RAM, and WiFi, Bluetooth and TLS all want some.
# A short-message device with one connection needs far fewer buffers than the defaults.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=6
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# Heap: drivers alone ask for 81 KB (WiFi 51, Bluetooth 26) assuming 32 + 32 dynamic WiFi
# buffers. Tiny messages need a fraction: fewer buffers, small TLS records (the default
# 16 KB in + 16 KB out would not fit next to the radios), and a heap sized by hand.
# Run `hal_heap_log()` (logged at each step of a cycle) on the board before tightening more.
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=2048
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HEAP_MEM_POOL_SIZE=60000
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# An unattended device must not stand still after a crash: restart (and pump pins come up off).
CONFIG_RESET_ON_FATAL_ERROR=y
