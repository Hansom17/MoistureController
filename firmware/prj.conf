# Moisture controller, DOIT ESP32 DevKit V1.

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_JSON_LIBRARY=y
CONFIG_CRC=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# Deep sleep between wake cycles; state that must survive lives in RTC slow RAM.
CONFIG_POWEROFF=y
CONFIG_RETAINED_MEM=y

# Settings in the `storage` partition: config, provisioning.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# WiFi station, DHCP, sockets, SNTP.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# MQTT 3.1.1 over TLS 1.2 with a pre-shared key (contracts/mqtt.md §2).
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS=y
# Only this suite: no public-key operations in the handshake, small code (mqtt.md §2).
CONFIG_MBEDTLS_CIPHERSUITE_TLS_PSK_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_PSK_MAX_LEN=32

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
