# The only channel between zigbee2mqtt, hub and api (Gateway/specs.md 3.6).
persistence true
persistence_location /mosquitto/data/

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# container network only; scripts/remote-api.sh adds a TLS listener in conf.d/ for an api on another device
listener 1883

include_dir /mosquitto/config/conf.d
