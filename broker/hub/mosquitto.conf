# Hub broker (Broker_Specs §2, §4). psk and conf.d/bridge.conf are written by
# the hub agent; until enrollment the psk file is empty and no device connects.
# Global security settings on purpose: with `per_listener_settings true`
# Mosquitto can't ACL-check messages for *disconnected* clients and drops
# them instead of queueing — sleeping devices would never get commands.
per_listener_settings false

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

max_queued_messages 100000
max_inflight_messages 20
max_packet_size 262144
persistent_client_expiration 30d
max_keepalive 120
retain_available true

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

allow_anonymous false
allow_zero_length_clientid false
# PSK identities for 8883, passwords for the internal user on 1883, one ACL
# for both (the internal user has its own `user` block).
psk_file /data/broker/psk
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# The household's devices, LAN only (published on the LAN IP by compose).
listener 8883
protocol mqtt
psk_hint mc
use_identity_as_username true
tls_version tlsv1.2
ciphers PSK-AES128-GCM-SHA256
max_connections 200

# Internal user, container network only (port not published).
listener 1883
protocol mqtt

# Bridge to the cloud (generated after enrollment).
include_dir /data/broker/conf.d
