name: CI

# Every job runs the same commands as the local checks listed in the pull request description.
# Tags are handled by release.yml, which runs this workflow first (workflow_call) and then builds the release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware-test:
    name: Firmware / host tests (ASan, UBSan)
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      # also checks that the generated files (firmware header, board table, converter data, hub parameters) are current
      - run: PlantModule/scripts/test_host.sh

  gateway-lint:
    name: Gateway / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --config Gateway/firmware/ruff.toml Gateway/firmware

  gateway-test:
    name: Gateway / hub and api tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Gateway/firmware/hub/pyproject.toml
            Gateway/firmware/api/pyproject.toml
      - run: pip install -e "Gateway/firmware/hub[dev]" -e "Gateway/firmware/api[dev]"
      - name: hub
        working-directory: Gateway/firmware/hub
        run: python -m pytest -q
      - name: api (runs against the real hub on an in-memory broker)
        working-directory: Gateway/firmware/api
        run: python -m pytest -q

  converter-test:
    name: Gateway / Zigbee2MQTT converter tests
    runs-on: ubuntu-latest
    env:
      Z2M_VERSION: "2.14.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the converter is tested against the real libraries of the pinned Zigbee2MQTT release
      - name: Zigbee2MQTT ${{ env.Z2M_VERSION }} with its dependencies
        run: |
          git clone --depth 1 --branch "$Z2M_VERSION" https://github.com/Koenkk/zigbee2mqtt.git "$RUNNER_TEMP/z2m"
          cd "$RUNNER_TEMP/z2m"
          corepack enable
          pnpm install --frozen-lockfile
      - run: Z2M_DIR="$RUNNER_TEMP/z2m" Gateway/scripts/test_converter.sh

  app-test:
    name: App / analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: the committed translations are current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - run: dart analyze
      - run: flutter test

  firmware-build:
    name: Firmware / build for ESP32-C6
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        working-directory: PlantModule/firmware
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32c6
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: moisture-firmware
          path: |
            PlantModule/firmware/build/*.bin
            PlantModule/firmware/build/bootloader/bootloader.bin
            PlantModule/firmware/build/partition_table/partition-table.bin
            PlantModule/firmware/build/flasher_args.json
          retention-days: 30
          if-no-files-found: error

  app-web-build:
    name: App / web build
    needs: app-test     # only a tested app is built
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - run: App/scripts/build_web.sh
      # the artifact holds the files the api serves; release.yml packs it into the update bundle
      - uses: actions/upload-artifact@v4
        with:
          name: moisture-web
          path: App/build/web
          retention-days: 30
          if-no-files-found: error

  gateway-compat:
    name: Gateway / update compatibility (dependencies, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the migration check compares with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install packaging
      # the Python dependencies of api and hub against Gateway/update/deps-<app_generation>.txt
      - run: python Gateway/scripts/check_deps.py
      - name: migrations of this change are safe for the previous release
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python Gateway/scripts/check_migrations.py --base "origin/${{ github.base_ref }}"
          else
            python Gateway/scripts/check_migrations.py
          fi

  gateway-bundle:
    name: Gateway / update bundle (build, determinism, run from folder)
    needs: app-web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: moisture-web
          path: web
      - name: build the bundle twice, the bytes must be identical
        run: |
          Gateway/scripts/make_release_bundle.sh 0.0.0-ci web dist1
          Gateway/scripts/make_release_bundle.sh 0.0.0-ci web dist2
          sha256sum dist1/*.tar.gz dist2/*.tar.gz
          cmp dist1/moisture-app-0.0.0-ci.tar.gz dist2/moisture-app-0.0.0-ci.tar.gz
      - name: run it with only the image's packages, from the bundle folder
        run: |
          mkdir bundle && tar -xzf dist1/*.tar.gz -C bundle
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r <(tail -n +2 Gateway/update/deps-1.txt)
          export PYTHONPATH="$PWD/bundle/api/src:$PWD/bundle/hub/src" MC_DATA_DIR="$RUNNER_TEMP/data"
          cd "$RUNNER_TEMP"
          py="$RUNNER_TEMP/venv/bin/python"
          "$py" -m mc_api migrate
          "$py" -m mc_hub migrate
          "$py" - <<PY
          import mc_api, mc_hub
          from mc_hub.services import boards
          root = "$GITHUB_WORKSPACE/bundle"
          assert mc_api.__file__.startswith(root) and mc_hub.__file__.startswith(root), (mc_api.__file__, mc_hub.__file__)
          assert mc_api.__version__ == mc_hub.__version__ == "0.0.0-ci"
          assert list(boards.DIR.glob("*.json")), "boards missing from the bundle"
          print("running from", root)
          PY
          # the api never imports the hub (they only meet over MQTT)
          if grep -rn "mc_hub" "$GITHUB_WORKSPACE/bundle/api/src"; then echo "the api must not import the hub"; exit 1; fi
