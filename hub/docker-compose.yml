# Home hub: Mosquitto (LAN broker + bridge) and the agent (Hub_Specs §2).
#
#   ./scripts/make-secrets.sh && docker compose up -d
#   docker compose logs -f agent      # shows the enrollment code
#   docker compose exec agent mc-hub status
#
# Settings in .env (see .env.example). No inbound internet exposure: the only
# published port is the device listener on the LAN.

name: mc-hub

x-restart: &restart
  restart: unless-stopped

services:
  agent:
    <<: *restart
    build:
      context: ..
      dockerfile: hub/Dockerfile
    image: mc-hub-agent:local
    environment:
      MC_CLOUD_API_URL: ${MC_CLOUD_API_URL:?set in .env}
      MC_MQTT_HOST: mosquitto
      MC_MQTT_PASSWORD_FILE: /run/secrets/mqtt_agent_password
      MC_LAN_HOST: ${MC_LAN_HOST:?set in .env — the hub's fixed LAN IP or hostname}
      MC_LAN_PORT: ${MC_LAN_PORT:-8883}
      MC_CLOUD_MQTT_HOST_OVERRIDE: ${MC_CLOUD_MQTT_HOST_OVERRIDE:-}
    secrets: [mqtt_agent_password]
    volumes: [hub-data:/data]
    read_only: true
    tmpfs: [/tmp]
    extra_hosts: ["host.docker.internal:host-gateway"]

  mosquitto:
    <<: *restart
    build: ../broker
    image: mc-broker:local
    depends_on:
      agent: {condition: service_started}
    environment:
      MC_BROKER_ROLE: hub
      MC_WATCH_DIR: /data/broker
      MC_BROKER_USER: mc-agent
      MC_BROKER_PASSWORD_FILE: /run/secrets/mqtt_agent_password
    secrets: [mqtt_agent_password]
    volumes:
      - ../broker/hub/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../broker/hub/acl:/mosquitto/config/acl:ro
      - mosquitto-data:/mosquitto/data
      - hub-data:/data:ro
    ports:
      - "${MC_LAN_BIND:-0.0.0.0}:${MC_LAN_PORT:-8883}:8883"
    read_only: true
    tmpfs: [/tmp]
    extra_hosts: ["host.docker.internal:host-gateway"]

secrets:
  mqtt_agent_password: {file: ./secrets/mqtt_agent_password}

volumes:
  hub-data:
  mosquitto-data:
