[project]
name = "mc-hub"
version = "0.1.0"
description = "MoistureController home hub agent"
requires-python = ">=3.13"
dependencies = ["mc-core", "aiomqtt>=2.3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mc-hub = "mc_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
