[project]
name = "mc-gateway"
version = "0.1.0"
description = "MoistureController gateway service"
requires-python = ">=3.13"
dependencies = ["mc-core", "aiomqtt>=2.3", "httpx>=0.27", "websockets>=14"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mc-gateway = "mc_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src", "../api/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
