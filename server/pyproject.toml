[project]
name = "mc-server"
version = "0.1.0"
description = "MoistureController cloud backend"
requires-python = ">=3.12"
dependencies = [
  "mc-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "sse-starlette>=2.1",
  "python-ulid>=3.0",
  "cryptography>=43",
  "pyyaml>=6",
]

[project.optional-dependencies]
firebase = ["firebase-admin>=6.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
mc-server = "mc_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../core/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
