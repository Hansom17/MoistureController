# Central stack: backend (v1 code, becomes api/) + PostgreSQL (Api_Specs §13).
# No MQTT broker here anymore — devices connect to their gateway (PROJECT D33).
# Runs unchanged on the Raspberry Pi (phase 1), a cloud VM (phase 2) and a
# developer machine. Everything site-specific lives in .env + secrets/.
#
#   cp .env.example .env && ./scripts/make-secrets.sh && docker compose up -d
#
# Profiles: `caddy` (HTTPS with Let's Encrypt, phase 2), `tunnel` (Cloudflare
# Tunnel, phase 1).

name: moisturecontroller

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mc
      POSTGRES_USER: mc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc"]
      interval: 5s
      retries: 20

  backend:
    <<: *restart
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: mc-server:local
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      MC_AUTH_MODE: ${MC_AUTH_MODE:-firebase}
      MC_DATABASE_URL: postgresql+asyncpg://mc:{password}@postgres:5432/mc
      MC_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      MC_BROKER_PUBLIC_HOST: ${MC_BROKER_PUBLIC_HOST:-localhost}   # pairing-bundle host until gateways key devices
      MC_BROKER_PUBLIC_PORT: ${MC_BROKER_PUBLIC_PORT:-8883}
      MC_KEY_ENCRYPTION_KEY_FILE: /run/secrets/key_encryption_key
      MC_FIREBASE_CREDENTIALS: ${MC_FIREBASE_CREDENTIALS:-}
      MC_FIREBASE_PROJECT_ID: ${MC_FIREBASE_PROJECT_ID:-}
      MC_PUBLIC_API_URL: ${MC_PUBLIC_API_URL:-http://localhost:8000}
      MC_APP_URL: ${MC_APP_URL:-http://localhost:8420}
      MC_CORS_ORIGINS: ${MC_CORS_ORIGINS:-}
      MC_MIN_APP_VERSION: ${MC_MIN_APP_VERSION:-}
    secrets: [postgres_password, key_encryption_key]
    volumes:
      - ${MC_FIREBASE_CREDENTIALS_DIR:-./secrets/firebase}:/run/firebase:ro
    ports:
      - "${MC_API_BIND:-127.0.0.1:8000}:8000"
    read_only: true
    tmpfs: [/tmp]

  caddy:
    <<: *restart
    profiles: [caddy]
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${MC_API_HOST:-api.localhost} --to backend:8000
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]

  cloudflared:
    <<: *restart
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${MC_CLOUDFLARE_TUNNEL_TOKEN:-}

secrets:
  postgres_password: {file: ./secrets/postgres_password}
  key_encryption_key: {file: ./secrets/key_encryption_key}

volumes:
  postgres-data:
  caddy-data:
