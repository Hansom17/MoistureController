# Cloud stack: backend + Mosquitto + PostgreSQL (Server_Specs §13).
# Runs unchanged on the Raspberry Pi (phase 1), a cloud VM (phase 2) and a
# developer machine. Everything site-specific lives in .env + secrets/.
#
#   cp .env.example .env && ./scripts/make-secrets.sh && docker compose up -d
#
# Profiles: `caddy` (HTTPS with Let's Encrypt, phase 2), `tunnel` (Cloudflare
# Tunnel, phase 1).

name: moisturecontroller

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mc
      POSTGRES_USER: mc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc -d mc"]
      interval: 5s
      retries: 20

  mosquitto:
    <<: *restart
    build: ../broker
    image: mc-broker:local
    environment:
      MC_BROKER_ROLE: cloud
      MC_WATCH_DIR: /broker-files
      MC_BROKER_USER: mc-backend
      MC_BROKER_PASSWORD_FILE: /run/secrets/mqtt_backend_password
    secrets: [mqtt_backend_password]
    # The backend creates broker-files with the right owner and writes psk/acl
    # before Mosquitto can start; the backend's MQTT client retries meanwhile.
    depends_on:
      backend: {condition: service_started}
    volumes:
      - ../broker/cloud/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - broker-files:/broker-files:ro
    ports:
      - "${MC_MQTT_BIND:-0.0.0.0:8883}:8883"   # TLS-PSK only; 1883 stays internal
    read_only: true
    tmpfs: [/tmp]   # mosquitto_passwd writes a temp file

  backend:
    <<: *restart
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: mc-server:local
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      MC_AUTH_MODE: ${MC_AUTH_MODE:-firebase}
      MC_DATABASE_URL: postgresql+asyncpg://mc:{password}@postgres:5432/mc
      MC_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      MC_MQTT_HOST: mosquitto
      MC_MQTT_PORT: "1883"
      MC_MQTT_USERNAME: mc-backend
      MC_MQTT_PASSWORD_FILE: /run/secrets/mqtt_backend_password
      MC_BROKER_FILES_DIR: /broker-files
      MC_BROKER_PUBLIC_HOST: ${MC_BROKER_PUBLIC_HOST:?set in .env}
      MC_BROKER_PUBLIC_PORT: ${MC_BROKER_PUBLIC_PORT:-8883}
      MC_KEY_ENCRYPTION_KEY_FILE: /run/secrets/key_encryption_key
      MC_FIREBASE_CREDENTIALS: ${MC_FIREBASE_CREDENTIALS:-}
      MC_FIREBASE_PROJECT_ID: ${MC_FIREBASE_PROJECT_ID:-}
      MC_PUBLIC_API_URL: ${MC_PUBLIC_API_URL:-http://localhost:8000}
      MC_APP_URL: ${MC_APP_URL:-http://localhost:8420}
      MC_CORS_ORIGINS: ${MC_CORS_ORIGINS:-}
      MC_MIN_APP_VERSION: ${MC_MIN_APP_VERSION:-}
      MC_LATEST_HUB_VERSION: ${MC_LATEST_HUB_VERSION:-0.1.0}
    secrets: [postgres_password, mqtt_backend_password, key_encryption_key]
    volumes:
      - broker-files:/broker-files
      - ${MC_FIREBASE_CREDENTIALS_DIR:-./secrets/firebase}:/run/firebase:ro
    ports:
      - "${MC_API_BIND:-127.0.0.1:8000}:8000"
    read_only: true
    tmpfs: [/tmp]

  caddy:
    <<: *restart
    profiles: [caddy]
    image: caddy:2-alpine
    command: caddy reverse-proxy --from ${MC_API_HOST:-api.localhost} --to backend:8000
    ports: ["80:80", "443:443"]
    volumes: [caddy-data:/data]

  cloudflared:
    <<: *restart
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${MC_CLOUDFLARE_TUNNEL_TOKEN:-}

secrets:
  postgres_password: {file: ./secrets/postgres_password}
  mqtt_backend_password: {file: ./secrets/mqtt_backend_password}
  key_encryption_key: {file: ./secrets/key_encryption_key}

volumes:
  postgres-data:
  mosquitto-data:
  broker-files:
  caddy-data:
